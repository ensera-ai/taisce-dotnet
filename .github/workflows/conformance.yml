#
# The adapter conformance suite, against a deployment this job stands up.
#
# The suite holds ten rules that are easy to get subtly wrong once per language and impossible to
# notice from inside one adapter: that injected memory is exactly one untrusted user message, that a
# recall failure is survived while the turn is still stored, that a write failure is never swallowed,
# that a failed model call stores nothing, that tool traffic and synthetic messages never become
# memory, that a retried turn is stored once. Until this file existed it ran only when a person ran
# it and looked at what it printed, so each adapter's own tests could stay green while its behaviour
# diverged from the other two. The divergence that matters is the quiet one: an adapter that
# swallows a store failure loses turns, and a lost turn is invisible until somebody asks what the
# system holds about them.
#
# On main and on demand, not on every pull request. A deployment per pull request costs runner
# minutes on every change; a release-only run lets a broken adapter sit on main between releases.
# This is the middle, and it is a decision rather than an omission.
name: conformance
on:
  push:
    branches: [main]
  # And on a pull request that changes this file. A deployment per pull request is what the policy
  # above declines to pay for on every change — but the one change where it is worth paying is this
  # file itself, which otherwise first executes on main, where a mistake in it is a red build on the
  # branch everything else is cut from.
  pull_request:
    paths: ['.github/workflows/conformance.yml']
  workflow_dispatch:
  # So a release workflow can require this run before it publishes.
  workflow_call:
permissions:
  contents: read
env:
  # The release this adapter is tested against: its binary carries the suite runner, and its images
  # are the deployment. Raised deliberately, so that what an adapter was proven against is a fact in
  # this file rather than whatever was newest on the day.
  TAISCE_VERSION: v0.5.1
  # The commit that release was cut from, for the two files that are not release assets. A commit
  # cannot be moved; a tag can be moved by whoever controls it, which is why the actions below are
  # pinned the same way.
  TAISCE_COMMIT: 16ced9eb409bd2ad543d1c4fb2d59cf5911390db
jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: The runner, verified against the release that published it
        run: |
          set -euo pipefail
          mkdir -p .conformance && cd .conformance
          base="https://github.com/ensera-ai/taisce/releases/download/${TAISCE_VERSION}"
          curl -fsSLO "${base}/taisce-${TAISCE_VERSION}-checksums.txt"
          curl -fsSLO "${base}/taisce-${TAISCE_VERSION}-linux-amd64"
          # Only the line for what was downloaded: the file lists every platform, and sha256sum -c
          # fails on a line whose file is absent.
          grep "taisce-${TAISCE_VERSION}-linux-amd64\$" "taisce-${TAISCE_VERSION}-checksums.txt" > want.txt
          sha256sum -c want.txt
          mv "taisce-${TAISCE_VERSION}-linux-amd64" taisce
          chmod +x taisce
          # The stack and the cases, from the commit the release was cut from.
          raw="https://raw.githubusercontent.com/ensera-ai/taisce/${TAISCE_COMMIT}"
          curl -fsSL -o compose.yaml "${raw}/compose.yaml"
          curl -fsSL -o cases.json "${raw}/conformance/cases.json"

      - name: A deployment, with a key that reaches nothing
        working-directory: .conformance
        env:
          COMPOSE_PROJECT_NAME: taisce-conformance
          TAISCE_PORT: '18080'
          # The suite stubs the model inside each driver and seeds facts through the API, so nothing
          # here calls a provider. The compose file refuses to run without a key, so it is given one
          # that is not a key, beside an allowlist that names no reachable host: if anything did try
          # to reach a model, it would be refused rather than sent somebody's words.
          TAISCE_INFERENCE_API_KEY: conformance-forms-nothing
          TAISCE_INFERENCE_ALLOWLIST: forms-nothing.invalid
        run: |
          set -euo pipefail
          # Waits on the API, which is what an adapter talks to. The worker is not started: without a
          # model it can never become healthy, and formation is not what this suite tests. So a green
          # run here says nothing about extraction — it says the adapter keeps its contract with the
          # deployment, which is the thing three languages can diverge on.
          docker compose up -d --wait api
          # Printed once and stored only as a digest, so it is read from the log it was printed in.
          token="$(docker compose logs bootstrap \
            | awk '/\| credential /{found=1; next} found && /token:/{sub(/.*token: /,""); print; exit}')"
          if [ -z "$token" ]; then
            echo "bootstrap printed no project token" >&2
            docker compose logs bootstrap >&2
            exit 1
          fi
          echo "::add-mask::$token"
          echo "TAISCE_TOKEN=$token" >> "$GITHUB_ENV"
          echo "TAISCE_API=http://localhost:18080" >> "$GITHUB_ENV"

      - name: The deployment and the suite answer
        working-directory: .conformance
        # The reference adapter first. It proves the deployment is reachable and the cases run, so a
        # failure below is the adapter under test rather than the stack it was run against.
        run: ./taisce conformance --api "$TAISCE_API" --cases cases.json --reference

      # Through the repository's own script, so what CI runs is what the README tells a person to
      # run: a workflow that invoked the driver its own way would prove a path nobody else takes.
      - name: The adapter
        env:
          TAISCE_BIN: ${{ github.workspace }}/.conformance/taisce
          TAISCE_CASES: ${{ github.workspace }}/.conformance/cases.json
        run: scripts/conformance.sh

      - name: What the deployment did
        if: always()
        working-directory: .conformance
        env:
          COMPOSE_PROJECT_NAME: taisce-conformance
          TAISCE_PORT: '18080'
          TAISCE_INFERENCE_API_KEY: conformance-forms-nothing
          TAISCE_INFERENCE_ALLOWLIST: forms-nothing.invalid
        run: |
          docker compose logs --no-color --tail 200 api || true
          docker compose down -v || true
