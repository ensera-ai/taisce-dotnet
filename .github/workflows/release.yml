#
# A release is a tag, packed and pushed by this workflow through NuGet trusted publishing: the
# runner exchanges its short-lived OIDC token for an API key that lives one hour, so no key is
# stored anywhere and none can be stolen from this repository. Each package carries a provenance
# attestation.
name: release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test Taisce.Tests --nologo
      - run: dotnet pack Taisce.Client -c Release -o dist -p:PackageVersion=${GITHUB_REF_NAME#v} && dotnet pack Taisce.AgentFramework -c Release -o dist -p:PackageVersion=${GITHUB_REF_NAME#v}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.nupkg
      - uses: NuGet/login@v1
        id: nuget
        with:
          user: hamza.althunibat
      - run: dotnet nuget push 'dist/*.nupkg' --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget.outputs.NUGET_API_KEY }} --skip-duplicate
