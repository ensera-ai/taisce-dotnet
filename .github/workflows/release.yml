#
# A release is a tag, packed and pushed by this workflow through NuGet trusted publishing: the
# runner exchanges its short-lived OIDC token for an API key that lives one hour, so no key is
# stored anywhere and none can be stolen from this repository. Each package carries a provenance
# attestation.
#
# The job runs in the `nuget` environment, which admits only `v*.*.*` tags and waits for a reviewer,
# because a version pushed to nuget.org can be unlisted but never removed. Running in an environment
# adds an `environment` claim to the OIDC token. A trusted-publishing policy on nuget.org with an
# empty Environment field is documented as unrestricted on that claim, so such a policy still
# matches. A policy that names an environment must name `nuget`. If the token exchange is ever
# refused, check that field first.
#
# Actions are referenced by commit SHA: a tag can be moved by whoever controls the action's
# repository, and a moved tag would run their code in the job that receives the publishing key.
name: release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test Taisce.Tests --nologo
      - run: dotnet pack Taisce.Client -c Release -o dist -p:PackageVersion=${GITHUB_REF_NAME#v} && dotnet pack Taisce.AgentFramework -c Release -o dist -p:PackageVersion=${GITHUB_REF_NAME#v}
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*.nupkg
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget
        with:
          user: hamza.althunibat
      - run: dotnet nuget push 'dist/*.nupkg' --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget.outputs.NUGET_API_KEY }} --skip-duplicate
