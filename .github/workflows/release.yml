#
# A release is a tag, packed and pushed by this workflow. No publishing key exists anywhere.
#
# The workflow proves who it is to nuget.org with a short-lived OIDC token GitHub signs for this
# repository and this workflow file, and nuget.org exchanges that for an API key valid about an hour
# and usable once. A stored key is the thing worth not having: it works from anywhere, for anybody
# who reads it, for as long as it lives, and a package published under this name by somebody else is
# indistinguishable from one published here — the people who find out first are the ones who
# installed it. An hour-long key issued inside a run started by a tag on this repository removes the
# part of that an attacker needs.
#
# The key is requested immediately before the push, because it expires.
#
# Each package also carries a build provenance attestation, which is the other half: the key says the
# publisher was trusted at the moment of publication, the attestation says which run produced these
# exact bytes.
name: release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test Taisce.Tests --nologo
      - run: dotnet pack Taisce.Client -c Release -o dist -p:PackageVersion=${GITHUB_REF_NAME#v} && dotnet pack Taisce.AgentFramework -c Release -o dist -p:PackageVersion=${GITHUB_REF_NAME#v}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.nupkg

      # Requested here rather than earlier: the key nuget.org issues lasts about an hour and is good
      # for one exchange, so anything between this step and the push is time spent on a key that is
      # already burning.
      - name: Exchange this run's identity for a short-lived publishing key
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - run: dotnet nuget push 'dist/*.nupkg' --source https://api.nuget.org/v3/index.json --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate
